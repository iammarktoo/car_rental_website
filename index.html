<body>
    <header>
        <a href="index.html">
            <h1 class = "site-header">Mark's Car Rental</h1>
        </a>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

         <!--Search Bar-->
        <section class="search">
            <div class="search-row">
                <input type="text" id="searchBox" placeholder="Search for cars...">

                    <option value="all">All</option>
                </select>
                <button id="searchBtn">Search</button>
            </div>
  <!-- Suggestions should stay aligned under the input box -->
  <ul id="suggestions" class="suggestions-list"></ul>
</section>
        <!--Car Grid-->
        <section id="home">
            <h2>Avaliable cars</h2>
            <p>We have a wide range of cars available for rent. Choose the one that suits you best!</p>
            <div class="car-grid" id="carGrid"></div>

        </section>
        <script src="js/script.js"></script>
    </main>
</body>
