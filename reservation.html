<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
    <header>
        <h1>Mark's Car Rental</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
        
        </ul>
    </nav>
    <main>
        <!--Car Grid-->
        <section id="reservation">
            <h2>Your Reservation</h2>
            <p>Click the confirm button to finish your reservation</p>
            <div class="car-grid" id="carGrid"></div>

        </section>

        <div id="reservationModal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Complete Your Reservation</h2>
                <form id="reservationForm">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <div class = "date-row">
                        <div>
                            <label for="startDate">Pickup Date:</label>
                            <input type="date" id="startDate" name="startDate" required>
                        </div>
                        <div>
                            <label for="endDate">Return Date:</label>
                            <input type="date" id="endDate" name="endDate" required>
                        </div>
                    </div>

                    <button type="submit">Submit Reservation</button>
                </form>
            </div>

        </div>
    <script>
        function loadFromLocalStorage(key) {
        try {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : null;
        } catch (error) {
            console.error("Error loading from local storage:", error);
            return null;
        }
    }
    

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const carId = params.get("carId");

            if (!carId) return;

            let carsData = loadFromLocalStorage("cars");

            const cars = Array.isArray(carsData) ? carsData : carsData?.cars;

            if (!Array.isArray(cars)) {
                console.error("Invalid car data format");
                return;
            }
            const selectedCar = cars.find(car => car.vin === carId);

            if (!selectedCar) {
                document.getElementById("carGrid").innerHTML = "<p>Car not found.</p>";
                return;
            }
            const reservationCard = document.createElement("div");
            reservationCard.className = "reservation-card";
            reservationCard.innerHTML = `
            <img src="images/${selectedCar.image}" alt="${selectedCar.brand} ${selectedCar.carModel}">
            <div class="reservation-card-content">
                <h2>${selectedCar.brand} ${selectedCar.carModel}</h2>
                <p><strong>Type:</strong> ${selectedCar.carType}</p>
                <p><strong>Year:</strong> ${selectedCar.yearOfManufacture}</p>
                <p><strong>Mileage:</strong> ${selectedCar.mileage}</p>
                <p><strong>Fuel:</strong> ${selectedCar.fuelType}</p>
                <p><strong>Availability:</strong> ${selectedCar.available ? "Available" : "Not available"}</p>
                <p><strong>Price:</strong> $${selectedCar.pricePerDay}/day</p>
                <p>${selectedCar.description}</p>
                <button class="confirm-btn">Confirm Reservation</button>
                <a class="cancel-btn" href = "index.html">Cancel</a>
            </div>
        `;
        const grid = document.getElementById("carGrid");
        grid.innerHTML = ""; // Clear previous content
        grid.appendChild(reservationCard);
        });

        document.addEventListener("DOMContentLoaded", function() {
            const confirmBtn = document.querySelector(".confirm-btn");
            const modal = document.getElementById("reservationModal");
            const closeBtn = document.querySelector(".close-btn");

            confirmBtn.addEventListener("click", function() {
                modal.style.display = "block";
            });

            closeBtn.addEventListener("click", function() {
                modal.style.display = "none";
            });

            window.addEventListener("click", function(event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });

            document.getElementById("reservationForm").addEventListener("submit", function(e){
                e.preventDefault();
                //Collect data and handle submission logic
                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const startDate = document.getElementById("startDate").value;
                const endDate = document.getElementById("endDate").value;
                //Data vlidation
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const start = new Date(startDate);
                const end = new Date(endDate);

                if (!email.includes("@")) {
                    alert("Please enter a valid email address.");
                    return;
                }

                if (start < today) {
                    alert("Pickup date cannot be in the past.");
                    return;
                }

                if (end <= start) {
                    alert("Return date cannot be before pickup date.");
                    return;
                }

                //Retrieve car VIN
                const params = new URLSearchParams(window.location.search);
                const vin = params.get("carId");
                //Load existing reservations from local storage
                let reservations = loadFromLocalStorage("reservations");
                if (!Array.isArray(reservations)) {
                    reservations = [];
                }
                //Append new reservation
                reservations.push({
                    name,
                    email,
                    startDate,
                    endDate,
                    vin
                });
                localStorage.setItem("reservations", JSON.stringify(reservations));

                //update car availability
                let carsData = loadFromLocalStorage("cars");
                let cars = Array.isArray(carsData) ? carsData : carsData?.cars || [];
                let carIndex = cars.findIndex(car => car.vin === vin);
                if (carIndex !== -1) {
                    cars[carIndex].availableUntil = endDate;
                    cars[carIndex].available = false;
                    localStorage.setItem("cars", JSON.stringify(cars));
                } else {
                    console.error("Car not found in local storage.");
                }

                //If everything is valid, proceed with submission
                console.log("Reservation submitted:", {name, email, startDate, endDate});
                //Close modal and show success message
                modal.style.display = "none";
                alert("Reservation confirmed!");
            });

        });
       

    </script>
    </main>
</body>
    <footer>
        <p>&copy; 2025 Mark's Car Renntal. All rights reserved.</p>
    </footer>
</html>
